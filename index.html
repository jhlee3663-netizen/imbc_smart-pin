<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smart Pin 웹 뷰어</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#3182f6;--primary-bg:#e8f3ff;--primary-dark:#1b64da;
  --bg:#f2f4f6;--card:#fff;
  --t1:#191f28;--t2:#4e5968;--t3:#8b95a1;
  --line:#e5e8eb;--line2:#f2f4f6;
  --success:#03b26c;--error:#f04452;--warning:#ffc342;
  --cat-design:#6366ff;--cat-descript:#11bb85;--cat-dev:#ff952f;--cat-ask:#ea4444;
  --r-card:14px;--r-btn:10px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input{font-family:inherit;outline:none}
a{text-decoration:none}

/* ── Screens ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── Setup ── */
#setup{align-items:center;justify-content:center;padding:40px 16px}
.setup-card{background:var(--card);border-radius:20px;padding:32px 28px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,0.06)}
.setup-logo{font-size:36px;margin-bottom:14px;text-align:center}
.setup-title{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:6px;letter-spacing:-0.03em;text-align:center}
.setup-sub{font-size:13px;color:var(--t2);line-height:1.7;text-align:center;margin-bottom:24px}
.notice-box{background:#fff9e7;border:1px solid #ffe09b;border-radius:10px;padding:14px 16px;font-size:12.5px;color:#7a5c00;line-height:1.65;margin-bottom:20px}
.notice-box strong{display:block;margin-bottom:3px;font-weight:700}
.field{margin-bottom:14px}
.field-label{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:6px;display:block}
.field-input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;color:var(--t1);background:var(--bg);transition:border-color .2s}
.field-input:focus{border-color:var(--primary);background:#fff}
.field-hint{font-size:11.5px;color:var(--t3);margin-top:6px;line-height:1.6}
.btn-fill{width:100%;height:48px;background:var(--primary);color:#fff;border-radius:var(--r-btn);font-size:15px;font-weight:700;letter-spacing:-0.01em;transition:background .2s;margin-top:6px}
.btn-fill:hover{background:var(--primary-dark)}
.btn-fill:disabled{background:#c9e2ff;cursor:default}

/* ── App header ── */
#app header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.h-inner{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px;max-width:560px;margin:0 auto}
.h-logo{font-size:18px;flex-shrink:0}
.h-title{font-size:16px;font-weight:800;color:var(--t1);letter-spacing:-0.03em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-file{font-size:12px;color:var(--t3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:8px;background:none;display:flex;align-items:center;justify-content:center;color:var(--t3);flex-shrink:0;transition:background .15s}
.icon-btn:hover{background:var(--bg);color:var(--t2)}
.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.updated-bar{font-size:11px;color:var(--t3);padding:5px 20px;background:var(--card);border-bottom:1px solid var(--line2);text-align:right;max-width:560px;margin:0 auto}

/* ── Search ── */
.search-wrap{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line2);position:sticky;top:52px;z-index:9}
.search-box{max-width:560px;margin:0 auto;position:relative}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search-input{width:100%;height:40px;background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:0 12px 0 36px;font-size:13.5px;color:var(--t1);transition:border-color .2s}
.search-input:focus{border-color:var(--primary);background:#fff}
.search-input::placeholder{color:var(--t3)}

/* ── Pin list ── */
.list{padding:16px 0 48px;flex:1;max-width:560px;width:100%;margin:0 auto}

.page-section{margin-bottom:8px}
.page-hd{padding:10px 20px 6px;display:flex;align-items:center;gap:8px}
.page-name{font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-0.02em}
.page-cnt{font-size:11px;font-weight:700;color:#fff;background:var(--primary);border-radius:9999px;padding:2px 8px}

.group-hd{padding:6px 20px 4px;font-size:11.5px;font-weight:600;color:var(--t3);display:flex;align-items:center;gap:4px}

.pin-card{background:var(--card);margin:0 12px 2px;border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.pin-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px}
.badge{width:26px;height:26px;border-radius:9999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.card-info{flex:1;min-width:0}
.card-title{font-size:13.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.card-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.card-group{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;border-radius:9999px;padding:1px 7px;line-height:1.5;flex-shrink:0}
.chip-design{background:rgba(99,102,255,0.12);color:#6366ff}
.chip-descript{background:rgba(17,187,133,0.12);color:#09955e}
.chip-dev{background:rgba(255,149,47,0.12);color:#d96b00}
.chip-ask{background:rgba(234,68,68,0.12);color:#c0282a}
.chip-done{background:rgba(139,149,161,0.12);color:#6b7684}
.chip-pending{background:rgba(255,195,66,0.15);color:#8a5700}
.chevron{color:var(--t3);transition:transform .25s;flex-shrink:0}
.chevron.open{transform:rotate(180deg)}

.card-detail{border-top:1px solid var(--line2);padding:14px 14px 16px;display:none}
.card-detail.open{display:block}
.detail-row{margin-bottom:12px}
.detail-label{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px}
.detail-val{font-size:13px;color:var(--t2);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.btn-figma{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;background:var(--primary-bg);color:var(--primary);border-radius:8px;font-size:13px;font-weight:600;transition:background .15s;margin-top:4px}
.btn-figma:hover{background:rgba(49,130,246,0.18)}

/* ── States ── */
.state{padding:52px 24px;text-align:center}
.state-icon{font-size:36px;margin-bottom:12px}
.state-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px}
.state-desc{font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:20px}
.btn-retry{height:40px;padding:0 20px;background:var(--primary);color:#fff;border-radius:8px;font-size:13.5px;font-weight:600;transition:background .15s}
.btn-retry:hover{background:var(--primary-dark)}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t1);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── Footer ── */
.footer{padding:12px 20px;text-align:center;font-size:11px;color:var(--t3)}
.footer button{color:var(--t3);font-size:11px;font-family:inherit;text-decoration:underline;cursor:pointer;background:none;border:none}

/* ── Skeleton ── */
.skel{background:linear-gradient(90deg,#e5e8eb 25%,#f0f2f4 50%,#e5e8eb 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--card);margin:0 12px 2px;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px}
.skel-circle{width:26px;height:26px;border-radius:9999px;flex-shrink:0}
.skel-lines{flex:1;display:flex;flex-direction:column;gap:7px}
.skel-line{height:12px}
.skel-line.s{width:55%}

mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
</style>
</head>
<body>

<!-- ── Setup Screen ── -->
<div id="setup" class="screen active">
  <div class="setup-card">
    <div class="setup-logo">📌</div>
    <div class="setup-title">Smart Pin 웹 뷰어</div>
    <div class="setup-sub">Dev 모드에서도 Smart Pin 핀 내용을<br>브라우저로 확인할 수 있어요.</div>

    <div id="notice-nokey" class="notice-box" style="display:none">
      <strong>파일 키가 없어요</strong>
      Smart Pin 플러그인에서 "웹으로 보기" 버튼을 클릭하면<br>
      파일 키가 포함된 URL로 자동 접속돼요.
    </div>

    <div class="field">
      <label class="field-label" for="key-input">Figma 파일 키</label>
      <input class="field-input" id="key-input" placeholder="예) aBcDeFgHiJkL..." autocomplete="off" spellcheck="false"/>
      <div class="field-hint">플러그인 "웹으로 보기" 버튼을 누르면 자동으로 입력돼요.</div>
    </div>

    <div class="field">
      <label class="field-label" for="token-input">Figma 개인 액세스 토큰</label>
      <input class="field-input" id="token-input" type="password" placeholder="figd_xxxxxxxxxxxx..." autocomplete="off"/>
      <div class="field-hint">
        Figma 계정 설정 → 보안 → 개인 액세스 토큰에서 발급<br>
        토큰은 이 기기에만 저장되며 외부 전송되지 않아요.
      </div>
    </div>

    <button class="btn-fill" id="connect-btn">연결하기</button>
  </div>
</div>

<!-- ── App Screen ── -->
<div id="app" class="screen">
  <header>
    <div class="h-inner">
      <span class="h-logo">📌</span>
      <span class="h-title">Smart Pin</span>
      <span class="h-file" id="h-file"></span>
      <button class="icon-btn" id="refresh-btn" title="새로고침">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 8A5.5 5.5 0 112.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M2.5 2v3h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="updated-bar" class="updated-bar" style="display:none"></div>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" id="search-input" type="text" placeholder="핀 검색..." autocomplete="off"/>
    </div>
  </div>

  <div class="list" id="pin-list"></div>

  <div class="footer">
    <button id="reset-btn">토큰 재설정</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────
const NS       = 'smart_pin';
const PINS_KEY = 'smart-pin-v1';
const STUBS_KEY= 'smart-pin-stubs-v1';
const PAT_LS   = 'sp_figma_pat';
const API_BASE = 'https://api.figma.com/v1';

const CAT_LABEL = {design:'Design',descript:'Descript',dev:'Dev',ask:'Ask'};
const CAT_CLASS = {design:'chip-design',descript:'chip-descript',dev:'chip-dev',ask:'chip-ask'};
const CAT_COLOR = {design:'#6366ff',descript:'#11bb85',dev:'#ff952f',ask:'#ea4444'};

// ── State ─────────────────────────────────────────────────────────────────
let fileKey     = new URLSearchParams(location.search).get('key') || '';
let token       = localStorage.getItem(PAT_LS) || '';
let pins        = [];
let stubs       = [];
let expandedId  = null;
let query       = '';
let refreshTimer= null;

// ── Utils ─────────────────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hi(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── API ───────────────────────────────────────────────────────────────────
async function apiFetch() {
  const r = await fetch(`${API_BASE}/files/${fileKey}?depth=1&plugin_data=shared`,
    { headers:{ 'X-Figma-Token': token } });
  if (!r.ok) {
    const e = await r.json().catch(()=>({}));
    throw new Error(e.err || e.message || `HTTP ${r.status}`);
  }
  const data = await r.json();
  const pd   = data.document?.sharedPluginData?.[NS] || {};
  return {
    name : data.name || '',
    pins : pd[PINS_KEY]  ? JSON.parse(pd[PINS_KEY])  : [],
    stubs: pd[STUBS_KEY] ? JSON.parse(pd[STUBS_KEY]) : [],
  };
}

// ── Render ────────────────────────────────────────────────────────────────
const matches = (p, q) => !q || [p.title,p.content,p.group,String(p.number)]
  .some(v => (v||'').toLowerCase().includes(q));

function buildTree(q) {
  const map = {};
  stubs.forEach(s => { map[s.pageId] = map[s.pageId] || {name:s.pageName,pins:[]}; });
  pins.forEach(p => {
    if (!map[p.pageId]) map[p.pageId] = {name:p.pageName||p.pageId,pins:[]};
    if (matches(p, q)) map[p.pageId].pins.push(p);
  });
  return map;
}

function badgeEl(p) {
  const done = p.status==='done';
  const c    = done ? '#8b95a1' : (CAT_COLOR[p.category]||'#8b95a1');
  return `<div class="badge" style="background:${c}">${p.number}</div>`;
}

function chips(p) {
  let h = '';
  const cc = CAT_CLASS[p.category];
  if (cc) h += `<span class="chip ${cc}">${esc(CAT_LABEL[p.category])}</span>`;
  if (p.status==='done')    h += `<span class="chip chip-done">완료</span>`;
  if (p.status==='pending') h += `<span class="chip chip-pending">보류</span>`;
  return h;
}

function pinCardHtml(p, q) {
  const open = expandedId === p.id;
  const node = (p.pinNodeId||'').replace(':','-');
  const link = fileKey && node ? `https://www.figma.com/design/${fileKey}?node-id=${node}` : null;

  return `
<div class="pin-card" data-id="${esc(p.id)}">
  <div class="card-head">
    ${badgeEl(p)}
    <div class="card-info">
      <div class="card-title">${hi(p.title||'(제목 없음)',q)}</div>
      <div class="card-meta">
        ${p.group ? `<span class="card-group">${hi(p.group,q)}</span>` : ''}
        ${chips(p)}
      </div>
    </div>
    <svg class="chevron ${open?'open':''}" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  ${open ? `
  <div class="card-detail open">
    ${p.title ? `<div class="detail-row"><div class="detail-label">제목</div><div class="detail-val">${hi(p.title,q)}</div></div>` : ''}
    ${p.content ? `<div class="detail-row"><div class="detail-label">내용</div><div class="detail-val">${hi(p.content,q)}</div></div>` : ''}
    ${p.group ? `<div class="detail-row"><div class="detail-label">그룹</div><div class="detail-val">${esc(p.group)}</div></div>` : ''}
    ${link ? `<a class="btn-figma" href="${esc(link)}" target="_blank" rel="noopener">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
        <path d="M7 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M10 2h4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 2L8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Figma에서 보기
    </a>` : ''}
  </div>` : ''}
</div>`;
}

function groupedPins(pagePins, q) {
  const gm = {};
  pagePins.forEach(p => { const g=p.group||''; (gm[g]=gm[g]||[]).push(p); });
  const groups = Object.keys(gm).sort((a,b) => !a ? 1 : !b ? -1 : a.localeCompare(b));
  return groups.map(g => {
    const sorted = gm[g].sort((a,b)=>(a.number||0)-(b.number||0));
    return (g ? `<div class="group-hd">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M2 5h6M5 2l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>${esc(g)}</div>` : '')
      + sorted.map(p => pinCardHtml(p,q)).join('');
  }).join('');
}

function render() {
  const q   = query.trim().toLowerCase();
  const map = buildTree(q);
  const el  = document.getElementById('pin-list');

  const pageIds = Object.keys(map).filter(id => q ? map[id].pins.length : true);
  if (!pageIds.length) {
    el.innerHTML = `<div class="state">
      <div class="state-icon">🔍</div>
      <div class="state-title">${q ? `"${esc(q)}" 검색 결과가 없어요` : '핀이 없어요'}</div>
      <div class="state-desc">${q ? '다른 검색어를 입력해보세요.' : 'Smart Pin 플러그인에서 핀을 추가해보세요.'}</div>
    </div>`;
    return;
  }

  el.innerHTML = pageIds.map(id => {
    const pg = map[id];
    return `<div class="page-section">
      <div class="page-hd">
        <span class="page-name">${esc(pg.name||id)}</span>
        <span class="page-cnt">${pg.pins.length}</span>
      </div>
      ${pg.pins.length
        ? groupedPins(pg.pins, q)
        : `<div style="padding:8px 20px;font-size:12px;color:var(--t3)">이 페이지에 핀이 없어요</div>`}
    </div>`;
  }).join('');

  el.querySelectorAll('.pin-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      expandedId = expandedId === id ? null : id;
      render();
    });
  });
}

function skeleton() {
  document.getElementById('pin-list').innerHTML = Array(5).fill(0).map(() =>
    `<div class="skel-card">
      <div class="skel skel-circle"></div>
      <div class="skel-lines">
        <div class="skel skel-line"></div>
        <div class="skel skel-line s"></div>
      </div>
    </div>`).join('');
}

// ── Load ──────────────────────────────────────────────────────────────────
async function load(soft=false) {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  if (!soft) skeleton();

  clearTimeout(refreshTimer);
  try {
    const d = await apiFetch();
    pins  = d.pins;
    stubs = d.stubs;
    document.getElementById('h-file').textContent = d.name;
    const bar = document.getElementById('updated-bar');
    bar.textContent = `마지막 업데이트 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
    bar.style.display = 'block';
    render();
  } catch(e) {
    const isAuth = /40[13]|[Ii]nvalid token|[Ff]orbidden/.test(e.message);
    document.getElementById('pin-list').innerHTML = `<div class="state">
      <div class="state-icon">⚠️</div>
      <div class="state-title">${isAuth ? '인증 오류' : '불러오기 실패'}</div>
      <div class="state-desc">${isAuth ? '토큰이 유효하지 않아요.' : esc(e.message)}</div>
      ${isAuth
        ? `<button class="btn-retry" onclick="resetToken()">토큰 재설정</button>`
        : `<button class="btn-retry" onclick="load()">다시 시도</button>`}
    </div>`;
  } finally {
    btn.classList.remove('spinning');
    refreshTimer = setTimeout(() => load(true), 30000);
  }
}

// ── Screen nav ────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById('setup').classList.remove('active');
  document.getElementById('app').classList.add('active');
  load();
}

function showSetup() {
  clearTimeout(refreshTimer);
  document.getElementById('app').classList.remove('active');
  document.getElementById('setup').classList.add('active');
  document.getElementById('key-input').value   = fileKey;
  document.getElementById('token-input').value = '';
  document.getElementById('notice-nokey').style.display = fileKey ? 'none' : 'block';
}

function resetToken() {
  localStorage.removeItem(PAT_LS);
  token = '';
  showSetup();
}

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById('key-input').value = fileKey;
document.getElementById('notice-nokey').style.display = fileKey ? 'none' : 'block';

document.getElementById('connect-btn').addEventListener('click', () => {
  const k = document.getElementById('key-input').value.trim();
  const t = document.getElementById('token-input').value.trim();
  if (!k) { toast('파일 키를 입력해주세요'); return; }
  if (!t) { toast('Figma 토큰을 입력해주세요'); return; }
  fileKey = k;
  token   = t;
  localStorage.setItem(PAT_LS, token);
  history.replaceState(null, '', `?key=${encodeURIComponent(fileKey)}`);
  showApp();
});

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('connect-btn').click();
});

document.getElementById('refresh-btn').addEventListener('click', () => load(true));
document.getElementById('reset-btn').addEventListener('click', resetToken);

document.getElementById('search-input').addEventListener('input', e => {
  query = e.target.value;
  render();
});

if (fileKey && token) showApp();
</script>
</body>
</html>
